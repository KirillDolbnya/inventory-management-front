services:
  frontend:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
